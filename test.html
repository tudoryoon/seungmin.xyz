<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>기록</title>
  <link rel="icon" href="favicon.ico?v=1" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=1" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=1" sizes="180x180">
  <meta name="theme-color" content="#080f14">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="포털">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="journal.css?v=20260914-5">
  <link rel="stylesheet" href="journal-theme.css?v=20260914-5">
  <link rel="stylesheet" href="library.css?v=20260914-5">
  <link rel="stylesheet" href="daily.css?v=20260914-5">
  <link rel="stylesheet" href="google-calendar.css?v=20260914-5">
  <link rel="stylesheet" href="workout.css?v=20260914-5">
  <link rel="stylesheet" href="pwa.css?v=1">
  <script src="pwa.js?v=1" defer></script>
</head>
<body class="session-checking">
  <header class="topbar"><a class="map-return" href="index.html#map"><i data-lucide="arrow-left"></i>지도</a><button class="settings-tab" data-tab="connections" aria-pressed="false" title="캘린더 연동" aria-label="캘린더 연동"><i data-lucide="settings-2"></i></button></header>
  <main class="workspace">
    <div class="account-bar"><p class="storage-note" id="storage-status">로그인 확인 중…</p><div class="actions"><button id="open-auth">로그인 / 가입</button><button id="refresh-records" hidden>새로고침</button><button id="sign-out" hidden>로그아웃</button></div></div>
    <div class="import-bar" id="import-bar" hidden><span>이 브라우저에 남아 있는 기록</span><button id="import-local">내 계정으로 가져오기</button></div>
    <p id="message" role="status"></p>
    <section id="calendar" class="view">
      <div class="section-head"><h1>일정관리</h1><button class="primary" id="add-event">일정 추가</button></div>
      <div class="google-toolbar"><p id="google-sync-status" role="status"></p><a id="google-setup-link" href="#connections">Google Calendar 연결</a><label id="event-destination-field" hidden>새 일정<select id="event-destination" aria-label="새 일정 저장 위치"><option value="local">내 기록</option></select></label></div>
      <details id="google-visibility" class="google-visibility" open hidden><summary>표시할 캘린더</summary><div id="google-calendar-filters" class="google-calendars" aria-label="표시할 Google 캘린더"></div></details>
      <div class="calendar-workspace">
      <div class="calendar-layout">
        <div><div class="month-toolbar"><h2 id="month-title"></h2><div class="actions"><button id="previous" aria-label="이전 달" title="이전 달">←</button><button id="today">오늘</button><button id="next" aria-label="다음 달" title="다음 달">→</button></div></div>
          <div class="weekdays" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
          <div id="month-grid" class="month-grid" aria-label="날짜 선택"></div>
        </div>
        <aside class="day-agenda"><h2 id="selected-date"></h2><div id="event-list"></div></aside>
      </div>
      <aside id="daily-panel" class="daily-panel" aria-labelledby="daily-title" hidden></aside>
      </div>
    </section>
    <section id="workout" class="view" hidden>
      <div class="section-head"><h1>운동계획</h1><div class="actions"><button id="add-workout-type" class="workout-icon" aria-label="운동 항목 추가" title="운동 항목 추가"><i data-lucide="list-plus"></i></button><button class="primary" id="add-workout"><i data-lucide="plus"></i>운동 추가</button></div></div>
      <div class="calendar-layout workout-layout">
        <div>
          <div class="month-toolbar"><h2 id="workout-month-title"></h2><div class="actions"><button id="workout-previous" class="workout-icon" aria-label="운동 이전 달" title="이전 달"><i data-lucide="chevron-left"></i></button><button id="workout-today">오늘</button><button id="workout-next" class="workout-icon" aria-label="운동 다음 달" title="다음 달"><i data-lucide="chevron-right"></i></button></div></div>
          <div class="weekdays" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
          <div id="workout-grid" class="month-grid" aria-label="운동 날짜 선택"></div>
          <p id="workout-summary" class="workout-summary" role="status"></p>
        </div>
        <aside class="day-agenda"><h2 id="workout-selected-date"></h2><div id="workout-list"></div></aside>
      </div>
      <section class="workout-week" aria-labelledby="workout-week-title">
        <div class="workout-week-heading"><h2 id="workout-week-title">주간 목표</h2><p id="workout-week-range"></p></div>
        <div id="workout-goals" class="workout-goals"></div>
      </section>
    </section>
    <section id="library" class="view" hidden aria-labelledby="library-title">
      <div class="section-head"><h1 id="library-title">자료 정리</h1><div class="library-actions"><button id="add-link"><i data-lucide="link"></i>링크 추가</button><button class="primary" id="add-files"><i data-lucide="upload"></i>파일 추가</button></div></div>
      <div class="library-toolbar"><label class="library-search"><i data-lucide="search"></i><input type="search" id="library-search" placeholder="자료 검색" aria-label="자료 검색" maxlength="200"></label><label><span class="sr-only">자료 유형</span><select id="library-filter"><option value="all">전체</option><option value="link">링크</option><option value="pdf">PDF</option><option value="image">이미지</option></select></label><button class="library-icon" id="library-trash" aria-label="휴지통" title="휴지통" aria-pressed="false"><i data-lucide="trash-2"></i></button></div>
      <div class="library-meta"><p id="library-count" aria-live="polite"></p><span>PDF · 이미지 / 파일당 20 MB</span></div>
      <p id="library-message" role="status"></p>
      <div id="library-grid" class="library-grid" aria-busy="true"></div>
      <div class="library-empty" id="library-empty" hidden><i data-lucide="library"></i><p id="library-empty-label">저장된 자료가 없습니다.</p></div>
    </section>
    <section id="connections" class="view" hidden>
      <div class="section-head"><h1>캘린더 연동</h1><a class="map-return" href="#calendar"><i data-lucide="arrow-left"></i>일정관리</a></div>
      <div class="connection-row"><div><h2>Google Calendar</h2><p id="google-account">연결 확인 중…</p></div><div class="actions"><button class="primary" id="google-connect">연결</button><button id="google-disconnect" hidden>연결 해제</button></div></div>
      <p id="google-connection-error" role="status"></p><div id="google-calendars" class="google-calendars" aria-label="표시할 Google 캘린더"></div>
      <div class="connection-row"><div><h2>네이버 캘린더</h2><p>네이버 일정 연결</p></div><span class="status">미연결</span></div>
    </section>
  </main>
  <dialog id="google-editor"><form id="google-form">
    <div class="dialog-head"><h2 id="google-editor-title">Google 일정</h2><button type="button" id="google-close" class="google-icon" aria-label="닫기" title="닫기"><i data-lucide="x"></i></button></div>
    <label>캘린더<select id="google-event-calendar" required></select></label>
    <label>제목<input id="google-title" maxlength="1000" required autocomplete="off"></label>
    <div class="form-grid"><label>시작일<input id="google-start-date" type="date" required></label><label>종료일<input id="google-end-date" type="date" required></label></div>
    <div class="form-grid"><label>시작 시간<input id="google-start-time" type="time" required></label><label>종료 시간<input id="google-end-time" type="time" required></label></div>
    <label class="check"><input type="checkbox" id="google-all-day">종일</label>
    <label>장소<input id="google-location" maxlength="1024"></label><label>메모<textarea id="google-notes" rows="4" maxlength="8192"></textarea></label>
    <p id="google-event-note" class="google-editor-note"></p><p id="google-error" role="alert"></p>
    <div class="dialog-actions"><button type="submit" class="primary" id="google-save"><i data-lucide="check"></i>Google에 저장</button></div>
  </form></dialog>
  <dialog id="link-dialog"><form id="link-form">
    <div class="dialog-head"><h2 id="link-editor-title">링크 추가</h2><button type="button" class="library-icon" data-close="link-dialog" aria-label="닫기" title="닫기"><i data-lucide="x"></i></button></div>
    <label id="link-url-field">사이트 주소<input id="link-url" type="text" inputmode="url" placeholder="https://" maxlength="2048" required></label>
    <label>이름<input id="link-title" maxlength="160" autocomplete="off"></label>
    <label>메모<textarea id="link-notes" rows="3" maxlength="4000"></textarea></label>
    <p id="link-error" class="library-error" role="alert"></p><div class="dialog-actions"><button type="submit" class="primary" id="save-link"><i data-lucide="check"></i>저장</button></div>
  </form></dialog>
  <dialog id="file-dialog"><form id="file-form">
    <div class="dialog-head"><h2>파일 추가</h2><button type="button" class="library-icon" data-close="file-dialog" aria-label="닫기" title="닫기"><i data-lucide="x"></i></button></div>
    <label class="file-drop" id="file-drop"><i data-lucide="upload"></i><span>파일 선택</span><small>PDF, JPG, PNG, WEBP, GIF, AVIF · 최대 20 MB</small><input id="library-files" type="file" accept="application/pdf,image/jpeg,image/png,image/webp,image/gif,image/avif" multiple></label>
    <ul id="upload-list" class="upload-list"></ul><p id="upload-error" class="library-error" role="alert"></p>
    <div class="dialog-actions"><button type="submit" class="primary" id="save-files" disabled><i data-lucide="upload"></i>저장</button></div>
  </form></dialog>
  <dialog id="resource-preview" class="resource-preview">
    <div class="dialog-head"><h2 id="preview-title"></h2><button class="library-icon" data-close="resource-preview" aria-label="닫기" title="닫기"><i data-lucide="x"></i></button></div>
    <p id="preview-status" role="status"></p><div id="preview-content"></div>
    <div class="dialog-actions"><a id="preview-download" class="library-command" hidden><i data-lucide="download"></i>다운로드</a><a id="preview-open" class="library-command" target="_blank" rel="noopener noreferrer" hidden><i data-lucide="external-link"></i>새 창</a></div>
  </dialog>
  <dialog id="editor">
    <form id="record-form">
      <div class="dialog-head"><h2 id="editor-title"></h2><button type="button" id="close-editor" aria-label="닫기">×</button></div>
      <label><span id="name-label">제목</span><input id="record-title" maxlength="100" required autocomplete="off"></label>
      <label>날짜<input type="date" id="record-date" required></label>
      <div id="event-fields"><div class="form-grid"><label>시작 시간<input type="time" id="start-time"></label><label>종료 시간<input type="time" id="end-time"></label></div><label class="check"><input type="checkbox" id="all-day">종일</label></div>
      <div id="workout-fields" hidden><div class="form-grid"><label>운동<select id="workout-type"><option>런닝</option><option>케틀벨 스윙</option><option>푸시업</option><option>스쿼트</option><option>플랭크</option></select></label><label>운동 시간 (분)<input type="number" id="duration" min="1" max="1440" step="1"></label></div><button type="button" id="editor-add-workout-type" class="workout-add-type"><i data-lucide="plus"></i>항목 추가</button><label class="check"><input type="checkbox" id="workout-completed">완료</label></div>
      <label>메모<textarea id="record-notes" rows="4" maxlength="4000" placeholder="자유롭게 기록"></textarea></label>
      <p id="form-error" role="alert"></p>
      <div class="dialog-actions"><button type="button" id="delete-record" class="danger" hidden>삭제</button><button type="submit" class="primary">저장</button></div>
    </form>
  </dialog>
  <dialog id="workout-type-dialog"><form id="workout-type-form">
    <div class="dialog-head"><h2>운동 항목 추가</h2><button type="button" id="close-workout-type" class="workout-icon" aria-label="운동 항목 창 닫기" title="닫기"><i data-lucide="x"></i></button></div>
    <label>운동 이름<input id="new-workout-type" maxlength="40" required autocomplete="off"></label>
    <p id="workout-type-error" role="alert"></p>
    <div class="dialog-actions"><button type="submit" class="primary" id="save-workout-type">추가</button></div>
  </form></dialog>
  <dialog id="auth-dialog"><form id="auth-form">
    <div class="dialog-head"><h2>내 기록 로그인</h2><button type="button" id="close-auth" aria-label="로그인 창 닫기">×</button></div>
    <label>이메일<input id="auth-email" type="email" required autocomplete="email"></label>
    <label>비밀번호<input id="auth-password" type="password" required minlength="8" autocomplete="current-password"></label>
    <p id="auth-message" role="status"></p>
    <div class="dialog-actions"><button type="submit" name="action" value="signup">회원가입</button><button class="primary" type="submit" name="action" value="login">로그인</button></div>
    <button type="button" id="forgot-password">비밀번호 재설정 메일</button>
  </form></dialog>
  <dialog id="password-dialog"><form id="password-form"><h2>새 비밀번호</h2><label>비밀번호<input id="new-password" type="password" required minlength="8" autocomplete="new-password"></label><p id="password-message" role="status"></p><button class="primary" type="submit">비밀번호 저장</button></form></dialog>
  <script src="vendor/supabase.js" defer></script>
  <script src="auth-client.js?v=20260914-5" defer></script>
  <script type="module" src="journal-gate.js?v=20260914-5"></script>
  <script src="cloud.js?v=20260914-5" defer></script>
  <script src="vendor/lucide.js" defer></script>
  <script src="workout.js?v=20260914-5" defer></script>
  <script src="journal.js?v=20260914-5" defer></script>
  <script type="module" src="google-calendar.js?v=20260914-5"></script>
  <script type="module" src="library.js?v=20260914-5"></script>
  <script type="module" src="daily.js?v=20260914-5"></script>
</body>
</html>
