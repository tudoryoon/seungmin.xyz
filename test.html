<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>기록 | Seungmin</title>
  <link rel="stylesheet" href="journal.css">
</head>
<body>
  <header class="topbar"><a href="index.html">seungmin.xyz</a><span>나의 기록</span></header>
  <main class="workspace">
    <nav aria-label="기록 메뉴">
      <button class="tab active" data-tab="calendar" aria-pressed="true">일정</button>
      <button class="tab" data-tab="workout" aria-pressed="false">운동 일지</button>
      <button class="tab" data-tab="connections" aria-pressed="false">연동</button>
    </nav>
    <p class="storage-note">이 브라우저에 저장 · 다른 기기와 동기화되지 않음</p>
    <p id="message" role="status"></p>
    <section id="calendar" class="view">
      <div class="section-head"><div><p class="eyebrow">CALENDAR</p><h1>일정</h1></div><button class="primary" id="add-event">일정 추가</button></div>
      <div class="calendar-layout">
        <div><div class="month-toolbar"><h2 id="month-title"></h2><div class="actions"><button id="previous" aria-label="이전 달" title="이전 달">←</button><button id="today">오늘</button><button id="next" aria-label="다음 달" title="다음 달">→</button></div></div>
          <div class="weekdays" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
          <div id="month-grid" class="month-grid" aria-label="날짜 선택"></div>
        </div>
        <aside class="day-agenda"><h2 id="selected-date"></h2><div id="event-list"></div></aside>
      </div>
    </section>
    <section id="workout" class="view" hidden>
      <div class="section-head"><div><p class="eyebrow">TRAINING LOG</p><h1>운동 일지</h1></div><button class="primary" id="add-workout">운동 기록</button></div>
      <div class="workout-filter"><label>조회 월 <input type="month" id="workout-month" required></label><p id="workout-summary"></p></div>
      <div id="workout-list"></div>
    </section>
    <section id="connections" class="view" hidden>
      <div class="section-head"><div><p class="eyebrow">CONNECTIONS</p><h1>캘린더 연동</h1></div></div>
      <div class="connection-row"><div><h2>Google Calendar</h2><p>Google 계정 연결</p></div><span class="status">미연결</span></div>
      <div class="connection-row"><div><h2>네이버 캘린더</h2><p>네이버 일정 연결</p></div><span class="status">미연결</span></div>
      <p class="connection-note">외부 캘린더 연결은 아직 준비 중입니다.</p>
    </section>
  </main>
  <dialog id="editor">
    <form id="record-form">
      <div class="dialog-head"><h2 id="editor-title"></h2><button type="button" id="close-editor" aria-label="닫기">×</button></div>
      <label><span id="name-label">제목</span><input id="record-title" maxlength="100" required autocomplete="off"></label>
      <label>날짜<input type="date" id="record-date" required></label>
      <div id="event-fields"><div class="form-grid"><label>시작 시간<input type="time" id="start-time"></label><label>종료 시간<input type="time" id="end-time"></label></div><label class="check"><input type="checkbox" id="all-day">종일</label></div>
      <div id="workout-fields" hidden><div class="form-grid"><label>종류<select id="workout-type"><option>근력</option><option>러닝</option><option>걷기</option><option>수영</option><option>사이클</option><option>요가</option><option>기타</option></select></label><label>운동 시간 (분)<input type="number" id="duration" min="1" max="1440" step="1"></label></div></div>
      <label>메모<textarea id="record-notes" rows="4" maxlength="4000" placeholder="자유롭게 기록"></textarea></label>
      <p id="form-error" role="alert"></p>
      <div class="dialog-actions"><button type="button" id="delete-record" class="danger" hidden>삭제</button><button type="submit" class="primary">저장</button></div>
    </form>
  </dialog>
  <script src="journal.js" defer></script>
</body>
</html>
