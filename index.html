<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="일정과 운동 기록.">
  <title>입장</title>
  <link rel="icon" href="favicon.ico?v=1" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=1" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=1" sizes="180x180">
  <meta name="theme-color" content="#080f14">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="포털">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preload" as="image" href="assets/realm-gate.webp">
  <link rel="stylesheet" href="styles.css?v=20260914-3">
  <link rel="stylesheet" href="dungeon.css?v=20260914-3">
  <link rel="stylesheet" href="continuity.css?v=20260914-3">
  <link rel="stylesheet" href="pwa.css?v=1">
  <script src="pwa.js?v=1" defer></script>
</head>
<body data-stage="entry" class="session-checking">
  <div class="world" aria-hidden="true"><div class="landscape"></div><canvas id="portal"></canvas><div class="world-shade"></div></div>
  <header class="realm-header">
    <div class="header-actions">
      <div id="realm-settings" class="realm-settings">
        <button id="settings-toggle" class="icon-button" type="button" title="설정" aria-label="설정" aria-expanded="false" aria-controls="settings-panel"><i data-lucide="settings" aria-hidden="true"></i></button>
        <div id="settings-panel" class="settings-panel" role="group" aria-label="설정" hidden>
          <label class="motion-control"><span>배경 움직임</span><input id="motion" type="checkbox" role="switch" checked aria-label="배경 움직임"></label>
          <button id="install-app" type="button" hidden><i data-lucide="download" aria-hidden="true"></i><span>앱 설치</span></button>
        </div>
      </div>
      <button id="logout" class="icon-button" title="로그아웃" aria-label="로그아웃" hidden><i data-lucide="log-out"></i></button>
    </div>
  </header>
  <p id="session-status" role="status">불러오는 중…</p>
  <main aria-busy="true">
    <section id="entry" class="stage entry-stage" aria-labelledby="entry-title">
      <div class="entry-copy">
        <h1 id="entry-title" class="sr-only">입장</h1>
        <button id="enter" class="enter-button"><span>입장</span><i data-lucide="arrow-up-right"></i></button>
      </div>
    </section>
    <section id="auth" class="stage form-stage" aria-labelledby="auth-title" hidden>
      <div class="form-wrap">
        <h1 id="auth-title" tabindex="-1">로그인</h1>
        <div class="segmented" role="group" aria-label="계정 작업"><button type="button" data-auth-mode="login" aria-pressed="true">로그인</button><button type="button" data-auth-mode="signup" aria-pressed="false">회원가입</button></div>
        <form id="auth-form">
          <label>이메일<input id="email" type="email" autocomplete="email" placeholder="you@example.com" required maxlength="254"></label>
          <label>비밀번호<span class="password-field"><input id="password" type="password" autocomplete="current-password" placeholder="8자 이상" minlength="8" maxlength="128" required><button class="icon-button" id="show-password" type="button" aria-label="비밀번호 표시" title="비밀번호 표시"><i data-lucide="eye"></i></button></span></label>
          <p id="auth-message" class="feedback" role="status"></p>
          <button class="primary wide" id="auth-submit" type="submit"><span>로그인</span><i data-lucide="arrow-right"></i></button>
          <button type="button" class="text-button reset-password" id="reset-password">비밀번호를 잊었나요?</button>
        </form>
      </div>
    </section>
    <section id="profile" class="stage form-stage" aria-labelledby="profile-title" hidden>
      <div class="form-wrap profile-wrap">
        <h1 id="profile-title" tabindex="-1">프로필</h1>
        <form id="profile-form">
          <div class="two-columns"><label>이름<input id="profile-name" autocomplete="nickname" maxlength="24" placeholder="이름 또는 별명" required></label><label>나이<input id="profile-age" type="number" inputmode="numeric" min="1" max="120" step="1" placeholder="만 나이" required></label></div>
          <label>성별<select id="profile-gender"><option value="unspecified">선택 안 함</option><option value="female">여성</option><option value="male">남성</option><option value="other">기타</option></select></label>
          <div class="two-columns"><label>MBTI<select id="profile-mbti"><option value="">모름 / 선택 안 함</option><option>INTJ</option><option>INTP</option><option>ENTJ</option><option>ENTP</option><option>INFJ</option><option>INFP</option><option>ENFJ</option><option>ENFP</option><option>ISTJ</option><option>ISFJ</option><option>ESTJ</option><option>ESFJ</option><option>ISTP</option><option>ISFP</option><option>ESTP</option><option>ESFP</option></select></label><label>혈액형<select id="profile-blood"><option value="">모름 / 선택 안 함</option><option>A</option><option>B</option><option>AB</option><option>O</option></select></label></div>
          <p id="profile-message" class="feedback" role="status"></p>
          <button class="primary wide" type="submit"><span>다음</span><i data-lucide="arrow-right"></i></button>
        </form>
      </div>
    </section>
    <section id="avatar" class="stage avatar-stage" aria-labelledby="avatar-title" hidden>
      <div class="avatar-layout">
        <div class="character-space">
          <p class="character-tag"><span class="status-dot"></span><span id="preview-label">미리보기</span></p>
          <div class="sprite-presentation"><canvas id="avatar-canvas" width="320" height="352" role="img" aria-label="생성한 도트 캐릭터"></canvas><div class="summon-floor" aria-hidden="true"></div></div>
          <div class="character-caption"><span id="character-class">도사</span><p id="character-name">캐릭터</p><span class="character-level" data-player-level>LV. 1</span></div>
          <div class="character-tools"><button id="turn-character" class="icon-button" title="방향 바꾸기" aria-label="방향 바꾸기"><i data-lucide="flip-horizontal-2"></i></button><button id="download-character" class="icon-button" title="아바타 PNG 다운로드" aria-label="아바타 PNG 다운로드"><i data-lucide="download"></i></button></div>
        </div>
        <div class="avatar-form-wrap">
          <h1 id="avatar-title" tabindex="-1">캐릭터</h1>
          <form id="avatar-form">
            <label for="character-prompt">캐릭터 설명</label>
            <textarea id="character-prompt" rows="4" maxlength="300" required placeholder="은빛 긴 머리에 청록색 도포를 입은 도사. 손에는 달빛 지팡이."></textarea>
            <div class="prompt-meta"><span id="prompt-count">0 / 300</span></div>
            <div class="presets" aria-label="캐릭터 초안"><button type="button" data-preset="은빛 긴 머리에 청록색 도포를 입은 도사. 손에는 달빛 지팡이.">도사</button><button type="button" data-preset="검은 포니테일에 붉은 도포를 입고 검을 든 검객.">검객</button><button type="button" data-preset="금발 짧은 머리에 초록색 옷과 활을 든 궁수.">궁수</button></div>
            <button class="primary wide" id="generate" type="submit"><i data-lucide="sparkles"></i><span>만들기</span></button>
          </form>
          <div id="avatar-result" hidden><p class="result-label">반영된 요소</p><ul id="traits" class="traits"></ul><button class="confirm-button wide" id="save-avatar"><span>저장</span><i data-lucide="check"></i></button></div>
          <p id="avatar-message" class="feedback" role="status"></p>
          <button class="text-button back-profile" id="back-profile"><i data-lucide="arrow-left"></i>프로필 수정</button>
        </div>
      </div>
    </section>
    <section id="complete" class="stage complete-stage" aria-labelledby="complete-title" hidden>
      <h1 id="complete-title" tabindex="-1">캐릭터</h1>
      <div class="complete-sprite"><canvas id="saved-avatar" width="320" height="352" role="img" aria-label="저장된 나의 분신"></canvas></div>
      <p id="saved-name" class="saved-name"></p><p class="saved-class"><span data-player-level>LV. …</span> · <span id="saved-class"></span></p>
      <p class="saved-status"><i data-lucide="cloud-check"></i>저장됨</p>
      <button type="button" class="primary complete-link" id="open-map"><span>지도</span><i data-lucide="arrow-right"></i></button>
      <div class="complete-actions"><button class="text-button" id="edit-avatar">캐릭터 수정</button><span>·</span><button class="text-button" id="edit-profile">프로필 수정</button></div>
    </section>
    <section id="map" class="stage map-stage" aria-labelledby="map-title" hidden>
      <picture class="dungeon-art" aria-hidden="true">
        <source media="(max-aspect-ratio: 1/1)" srcset="assets/dungeon-tall-v2.webp">
        <img src="assets/dungeon-wide-v2.webp" alt="" width="1586" height="992" decoding="sync" fetchpriority="low">
      </picture>
      <canvas id="map-wind" class="map-wind" aria-hidden="true" hidden></canvas>
      <div class="map-shade" aria-hidden="true"></div>
      <h1 id="map-title" tabindex="-1">지도</h1>
      <div class="dungeon-locations" role="group" aria-label="던전 위치">
        <a class="dungeon-node node-calendar" data-destination="test.html#calendar" data-location="calendar">
          <span class="node-pin"><i data-lucide="calendar-days"></i></span><span class="node-label">일정관리</span>
        </a>
        <a class="dungeon-node node-workout" data-destination="test.html#workout" data-location="workout">
          <span class="node-pin"><i data-lucide="dumbbell"></i></span><span class="node-label">운동계획</span>
        </a>
        <a class="dungeon-node node-roulette" data-destination="roulette.html" data-location="roulette">
          <span class="node-pin"><i data-lucide="disc-3"></i></span><span class="node-label">룰렛</span>
        </a>
        <a class="dungeon-node node-library" data-destination="test.html#library" data-location="library">
          <span class="node-pin"><i data-lucide="library"></i></span><span class="node-label">자료 정리</span>
        </a>
      </div>
      <div class="map-actor" id="map-actor"><canvas id="map-avatar" width="160" height="176" role="img" aria-label="내 캐릭터"></canvas><span class="actor-shadow" aria-hidden="true"></span></div>
      <div class="map-controls"><div class="direction-pad" aria-label="캐릭터 이동"><button data-move="ArrowUp" aria-label="위로 이동" title="위로 이동"><i data-lucide="chevron-up"></i></button><button data-move="ArrowLeft" aria-label="왼쪽으로 이동" title="왼쪽으로 이동"><i data-lucide="chevron-left"></i></button><button data-move="ArrowDown" aria-label="아래로 이동" title="아래로 이동"><i data-lucide="chevron-down"></i></button><button data-move="ArrowRight" aria-label="오른쪽으로 이동" title="오른쪽으로 이동"><i data-lucide="chevron-right"></i></button></div><button id="nearby-enter" hidden><i data-lucide="door-open"></i>입장</button></div>
      <button type="button" class="map-character" id="map-character" title="캐릭터 보기" aria-label="캐릭터 보기"><i data-lucide="user-round"></i><span id="map-name"></span><span class="map-level" data-player-level>LV. …</span><i data-lucide="chevron-right"></i></button>
    </section>
  </main>
  <nav class="journey" aria-label="생성 진행 상황" hidden><ol><li data-step="auth"><span>01</span>계정</li><li data-step="profile"><span>02</span>프로필</li><li data-step="avatar"><span>03</span>캐릭터</li></ol></nav>
  <p id="global-message" class="global-message" role="status"></p>
  <noscript><p class="noscript">입장하려면 브라우저에서 JavaScript를 켜주세요.</p></noscript>
  <script src="vendor/supabase.js" defer></script>
  <script src="auth-client.js?v=20260914-3" defer></script>
  <script src="vendor/lucide.js" defer></script>
  <script type="module" src="realm.js?v=20260914-3"></script>
  <script type="module" src="player-level.js?v=20260914-3"></script>
  <script type="module" src="map-wind.js?v=20260914-3"></script>
</body>
</html>
